    <main>
        <div class="container">
            <section class="kartu">
                <h2>Hubungi Saya</h2>
                <p>Punya pertanyaan atau ingin bekerja sama? Isi form berikut.</p>

                <form>
                    <p>
                        <label for="nama">Nama lengkap</label><br>
                        <input type="text" id="nama" name="nama"
                        placeholder="Contoh: Slamet" required>
                    </p>

                    <p>
                        <label for="email">Email</label><br>
                        <input type="email" id="email" name="email"
                        placeholder="nama@gmail.com" required>
                    </p>

                    <p>
                        <label for="hp">Nomor HP</label><br>
                        <input type="tel" id="hp" name="hp"
                        placeholder="081234567890" required>
                    </p>

                    <p>
                        <label for="keperluan">Keperluan</label><br>
                        <select id="keperluan" name="keperluan" required>
                            <option value="">-- Pilih keperluan --</option>
                            <option value="bertanya">Bertanya</option>
                            <option value="kerja-sama">Kerja sama proyek</option>
                            <option value="lainnya">Lainnya</option>
                        </select>
                    </p>

                    <p>
                        <label for="pesan">Pesan</label><br>
                        <textarea id="pesan" name="pesan" rows="5"
                        cols="40" placeholder="Tulis pesanmu di sini"
                        required></textarea>
                    </p>

                    <button type="submit">Kirim Pesan</button>
                </form>
            </section>
        </div>
